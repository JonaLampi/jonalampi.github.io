<script>
    function renderDetail() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
            document.getElementById('detail-container').innerHTML = '<p>No captain selected</p>';
            return;
        }

        const person = getTableCaptainById(id);

        if (!person) {
            document.getElementById('detail-container').innerHTML = '<p>Captain not found</p>';
            return;
        }

        const hasOrg = person.tags?.company && person.tags.company.trim() !== '';

        document.getElementById('detail-container').innerHTML = `
          <div class="candidate-layout">
            <aside class="candidate-sidebar">
              <img class="candidate-photo" src="data/tableCaptains/images/${person.picture}" alt="${person.name}">
              <div class="candidate-meta">
                <div class="meta-item">
                  <span class="meta-label">Name</span>
                  <h2>${person.name}</h2>
                </div>
                ${hasOrg ? `
                <div class="meta-item">
                  <span class="meta-label">Organisation</span>
                  <p>${person.tags.company}</p>
                </div>
                ` : ''}
                <div class="meta-item">
                  <span class="meta-label">Event</span>
                  <p>${person.tags.event}</p>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Tisch</span>
                  <p>${person.table || 'Noch offen'}</p>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Links</span>
                  <div class="candidate-links">
                    ${person.email ? `<a href="mailto:${person.email}"><img src="icons/company.svg" alt="E-Mail" class="icon"> E‑Mail</a>` : ''}
                    ${person.social?.linkedin ? `<a href="${person.social.linkedin}" target="_blank" rel="noopener noreferrer"><img src="icons/linkedin.svg" alt="LinkedIn" class="icon"> LinkedIn</a>` : ''}
                    ${person.social?.instagram ? `<a href="${person.social.instagram}" target="_blank" rel="noopener noreferrer"><img src="icons/instagram.svg" alt="Instagram" class="icon"> Instagram</a>` : ''}
                  </div>
                </div>
              </div>
            </aside>

            <section class="candidate-content">
              <span class="eyebrow">Table Captain</span>
              <h2>${person.name}</h2>
              <p class="text-lead" style="margin-bottom: var(--space-md);">${person.shortDescription}</p>
              <div class="full-text">${(person.description || '')
                .replace(/\r\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\n/g, '<br>')}
              </div>
              <h3 style="margin-top: var(--space-md);">Was mich antreibt</h3>
              <div class="full-text">${(person.whatDrivesMe || '')
                .replace(/\r\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\n/g, '<br>')}
              </div>
              <h3 style="margin-top: var(--space-md);">Warum gerade jetzt?</h3>
              <div class="full-text">${(person.whyNow || '')
                .replace(/\r\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\n/g, '<br>')}
              </div>
              <h3 style="margin-top: var(--space-md);">Komme an meinen Tisch, wenn ...</h3>
              <div class="full-text">${(person.joinMyTable || '')
                .replace(/\r\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\n/g, '<br>')}
              </div>
              
            </section>
          </div>
        `;
    }

    document.addEventListener('DOMContentLoaded', renderDetail);
</script>

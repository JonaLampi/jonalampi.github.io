<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Clean white background for contrast -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- 
    LETTER B (Left side)
    Color: #2B2620 (Dark Brown)
    Represents the structured, grounded form. 
    The top loop extends into the center as a "hand" reaching for a handshake.
  -->
  <!-- Vertical Stem -->
  <path d="M 140 80 L 140 420" stroke="#2B2620" stroke-width="44" stroke-linecap="round" />
  <!-- Top Loop (The reaching hand) -->
  <path d="M 162 180 C 240 180, 280 220, 260 280" stroke="#2B2620" stroke-width="44" stroke-linecap="round" fill="none" />
  <!-- Bottom Loop -->
  <path d="M 162 320 C 240 320, 240 410, 140 410" stroke="#2B2620" stroke-width="44" stroke-linecap="round" fill="none" />

  <!-- 
    LETTER S (Right side)
    Color: #234649 (Teal)
    Represents the fluid, supportive nature of volunteering. 
    The continuous flow from bottom right to top right naturally passes through the center to complete the handshake.
  -->
  <path d="M 360 420 C 240 420, 200 360, 260 280 C 300 240, 320 200, 360 140" stroke="#234649" stroke-width="44" stroke-linecap="round" fill="none" />

  <!-- 
    HANDSHAKE ACCENTS (Center)
    Color: #F5B921 (Gold)
    Highlights the moment of connection and voluntary work.
    The interlocking thumbs and fingers symbolize mutual support and cooperation.
  -->
  <!-- Left Hand (B) Fingers gripping down -->
  <path d="M 260 280 C 275 290, 280 310, 265 320" stroke="#F5B921" stroke-width="18" stroke-linecap="round" fill="none" />
  
  <!-- Right Hand (S) Fingers gripping up -->
  <path d="M 260 280 C 245 270, 240 250, 255 240" stroke="#F5B921" stroke-width="18" stroke-linecap="round" fill="none" />
  
  <!-- Left Hand (B) Thumb overlapping -->
  <path d="M 260 280 C 275 280, 275 295, 260 295" stroke="#F5B921" stroke-width="16" stroke-linecap="round" fill="none" />
  
  <!-- Right Hand (S) Thumb overlapping -->
  <path d="M 260 280 C 245 280, 245 265, 260 265" stroke="#F5B921" stroke-width="16" stroke-linecap="round" fill="none" />
</svg>
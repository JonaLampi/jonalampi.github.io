<svg viewBox="40 100 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Menschen kommen an einem Tisch zusammen">
  <!-- Background circle: warm section area -->
  <ellipse cx="200" cy="220" rx="150" ry="65" fill="#FFF3D6" stroke="#EADFC0" stroke-width="2"/>

  <!-- Orange ring that people sit on -->
  <ellipse cx="200" cy="220" rx="130" ry="55" fill="none" stroke="#F5B921" stroke-width="6" />

  <!-- Inner white area for contrast -->
  <ellipse cx="200" cy="220" rx="109" ry="40" fill="#FFFBF2" />

  <!-- table legs (stylised blocks) centered below the table -->
  <rect x="160" y="220" width="80" height="36" rx="8" fill="#2B2620" opacity="0.95" />
  
  <!-- Top (270°) - head petrol, body yellow, stroked for contrast -->
  <g transform="translate(200 120)">
    <circle cx="0" cy="0" r="16" fill="#2F5D62" stroke="#234649" stroke-width="1" />
    <rect x="-14" y="18" width="28" height="34" rx="10" fill="#F5B921" stroke="#D99A00" stroke-width="1" />
  </g>

  <!-- Top-right (315°) - head yellow, body petrol -->
  <g transform="translate(285 135)">
    <circle cx="0" cy="0" r="16" fill="#F5B921" stroke="#D99A00" stroke-width="1" />
    <rect x="-14" y="18" width="28" height="34" rx="10" fill="#2F5D62" stroke="#234649" stroke-width="1" />
  </g>

    <!-- Top-left (225°) - head petrol-deep, body petrol (contrasting strokes) -->
  <g transform="translate(115 135)">
    <circle cx="0" cy="0" r="16" fill="#234649" stroke="#0b0b0b" stroke-width="1" />
    <rect x="-14" y="18" width="28" height="34" rx="10" fill="#2F5D62" stroke="#234649" stroke-width="1" />
  </g>
  <!-- Oval table: outer rim (white) with petrol tabletop inside -->
  <!-- <ellipse cx="200" cy="200" rx="125" ry="72" fill="#FFFFFF" stroke="#F5B921" stroke-width="8" /> -->
  <ellipse cx="200" cy="200" rx="104" ry="30" fill="#F5B921" />

  <!-- subtle tabletop highlight -->
  <ellipse cx="200" cy="200" rx="88" ry="24" fill="#EADFC0" opacity="0.6" />

  <!-- Eight simplified person silhouettes positioned on the orange ring. -->
  <!-- Positions computed around circle r=148 at 45° increments. Each group has head (circle) and body (rounded rect). -->

  <!-- Right (0°) - head ink, body yellow-deep -->
  <g transform="translate(325 180)">
    <circle cx="0" cy="0" r="16" fill="#2B2620" stroke="#111111" stroke-width="1" />
    <rect x="-14" y="18" width="28" height="34" rx="10" fill="#D99A00" stroke="#2B2620" stroke-width="1" />
  </g>

  <!-- Bottom-right (45°) - head petrol-deep, body petrol -->
  <g transform="translate(285 215)">
    <circle cx="0" cy="0" r="16" fill="#234649" stroke="#0b0b0b" stroke-width="1" />
    <rect x="-14" y="18" width="28" height="34" rx="10" fill="#2F5D62" stroke="#234649" stroke-width="1" />
  </g>

  <!-- Bottom (90°) - head petrol, body yellow -->
  <g transform="translate(200 230)">
    <circle cx="0" cy="0" r="16" fill="#2F5D62" stroke="#234649" stroke-width="1" />
    <rect x="-14" y="18" width="28" height="34" rx="10" fill="#F5B921" stroke="#D99A00" stroke-width="1" />
  </g>

  <!-- Bottom-left (135°) - head yellow, body ink -->
  <g transform="translate(115 215)">
    <circle cx="0" cy="0" r="16" fill="#F5B921" stroke="#D99A00" stroke-width="1" />
    <rect x="-14" y="18" width="28" height="34" rx="10" fill="#2B2620" stroke="#0a0a0a" stroke-width="1" />
  </g>

  <!-- Left (180°) - head ink, body yellow-deep -->
  <g transform="translate(75 180)">
    <circle cx="0" cy="0" r="16" fill="#2B2620" stroke="#111111" stroke-width="1" />
    <rect x="-14" y="18" width="28" height="34" rx="10" fill="#D99A00" stroke="#2B2620" stroke-width="1" />
  </g>

</svg>
